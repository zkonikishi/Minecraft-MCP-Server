name: CI Build

on:
  push:
    branches: [ main, '26.2' ]
  pull_request:
    branches: [ main, '26.2' ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.x', '24.x', '26.x']

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: TypeCheck
      run: npm run typecheck

    - name: TypeCheck compatibility API
      run: npm run typecheck:compat

    - name: Build
      run: npm run build

    - name: Test
      run: npm test
